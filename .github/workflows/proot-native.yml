name: PRoot Native ARM64

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/native/build-proot-runtime.sh"
      - "docs/PHASE-30-PROOT-ENGINE-PACKAGING.md"
      - ".github/workflows/proot-native.yml"

permissions:
  contents: write

concurrency:
  group: proot-native-arm64
  cancel-in-progress: true

jobs:
  build-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: ndk;27.2.12479018

      - name: Configure NDK path
        shell: bash
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install build utilities
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl unzip

      - name: Build pinned PRoot and loader
        run: bash scripts/native/build-proot-runtime.sh

      - name: Bundle ARM64 PRoot payload into Android jniLibs
        shell: bash
        run: |
          set -euo pipefail
          install -D -m 0755 build/proot-native/artifact/arm64-v8a/libproot.so app/src/main/jniLibs/arm64-v8a/libproot.so
          install -D -m 0755 build/proot-native/artifact/arm64-v8a/libproot_loader.so app/src/main/jniLibs/arm64-v8a/libproot_loader.so
          install -D -m 0644 build/proot-native/artifact/build-manifest.txt app/src/main/assets/proot-runtime/build-manifest.txt
          install -D -m 0644 build/proot-native/artifact/SHA256SUMS app/src/main/assets/proot-runtime/SHA256SUMS
          install -D -m 0644 build/proot-native/artifact/PAYLOAD-SHA256SUMS app/src/main/assets/proot-runtime/PAYLOAD-SHA256SUMS
          mkdir -p app/src/main/assets/licenses/proot-runtime
          cp -a build/proot-native/artifact/licenses/. app/src/main/assets/licenses/proot-runtime/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/jniLibs/arm64-v8a/libproot.so app/src/main/jniLibs/arm64-v8a/libproot_loader.so app/src/main/assets/proot-runtime/build-manifest.txt app/src/main/assets/proot-runtime/SHA256SUMS app/src/main/assets/proot-runtime/PAYLOAD-SHA256SUMS app/src/main/assets/licenses/proot-runtime/
          if git diff --cached --quiet; then
            echo "Bundled PRoot payload is already current."
          else
            git commit -m "build(workstation): bundle verified ARM64 PRoot runtime"
            git push origin HEAD:main
          fi

      - name: Upload native runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: forge-ts-proot-native-arm64
          path: build/proot-native/artifact/
          if-no-files-found: error
          retention-days: 14
