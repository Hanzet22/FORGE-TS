name: Supabase Edge Function Type Check

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/supabase-functions.yml"
  pull_request:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/supabase-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.4
      - name: Type-check Edge Functions
        run: |
          deno check --frozen --lock=deno.lock supabase/functions/forge-crash-ingest/index.ts
          deno check --lock=deno.lock supabase/functions/forge-diagnostic-ingest/index.ts
          deno check --lock=deno.lock supabase/functions/forge-redis-gateway/index.ts
